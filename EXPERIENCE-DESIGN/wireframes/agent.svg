<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">Agent Control wireframe</title><desc id="desc">Static labeled layout. Synthetic design annotations, no live data. Lifecycle / observed activities; Task queue and current blocker; Skills, modules and sources; Grants / exact target scopes; Trust, performance and health; Resource limits / history</desc><rect width="1440" height="1000" fill="#0C1110" /><rect x="0" y="0" width="1440" height="56" rx="8" fill="#18211C" stroke="#29342D" /><text x="24" y="36" fill="#C9F58C" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold">OMNIDEV SWARM</text><text x="280" y="35" fill="#B5C3B9" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Organization / Workspace / Project / Environment</text><text x="1050" y="35" fill="#E7ECE8" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal">Omni Command   /   Inbox</text><text x="24" y="110" fill="#C9F58C" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal">Focus</text><text x="24" y="158" fill="#B5C3B9" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal">Projects</text><text x="24" y="206" fill="#B5C3B9" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal">Swarms</text><text x="24" y="254" fill="#B5C3B9" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal">Explore</text><text x="24" y="302" fill="#B5C3B9" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal">Operations</text><text x="24" y="350" fill="#B5C3B9" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal">Discover</text><text x="24" y="398" fill="#B5C3B9" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal">Decisions</text><text x="24" y="925" fill="#B5C3B9" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Settings / Help</text><text x="240" y="105" fill="#E7ECE8" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold">Agent Control</text><text x="240" y="137" fill="#B5C3B9" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal">Manage competence, grants and work</text><text x="240" y="166" fill="#94D7CB" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal">Scope / as_of / coverage / actual capability availability</text><rect x="240" y="200" width="390" height="205" rx="8" fill="#121916" stroke="#708879" /><text x="258" y="235" fill="#E7ECE8" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold">01 / Lifecycle</text><text x="258" y="272" fill="#B5C3B9" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Created / Active / Dormant / Retired</text><text x="258" y="302" fill="#B5C3B9" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Busy / Reviewing / Collaborating</text><text x="258" y="357" fill="#C9F58C" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Inspect details  &gt;</text><rect x="650" y="200" width="390" height="205" rx="8" fill="#121916" stroke="#708879" /><text x="668" y="235" fill="#E7ECE8" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold">02 / Task queue and current blocker</text><text x="668" y="272" fill="#B5C3B9" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Task / expected outcome / acceptance</text><text x="668" y="302" fill="#B5C3B9" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Provider / worker / approval wait</text><text x="668" y="357" fill="#C9F58C" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Inspect details  &gt;</text><rect x="240" y="425" width="390" height="205" rx="8" fill="#121916" stroke="#708879" /><text x="258" y="460" fill="#E7ECE8" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold">03 / Skills, modules and sources</text><text x="258" y="497" fill="#B5C3B9" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Installed pack / version / skill</text><text x="258" y="527" fill="#B5C3B9" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Authorized memory selector</text><text x="258" y="582" fill="#C9F58C" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Inspect details  &gt;</text><rect x="650" y="425" width="390" height="205" rx="8" fill="#121916" stroke="#708879" /><text x="668" y="460" fill="#E7ECE8" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold">04 / Grants</text><text x="668" y="497" fill="#B5C3B9" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Target / action / expiry</text><text x="668" y="527" fill="#B5C3B9" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Trust cannot expand grant</text><text x="668" y="582" fill="#C9F58C" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Inspect details  &gt;</text><rect x="240" y="650" width="390" height="205" rx="8" fill="#121916" stroke="#708879" /><text x="258" y="685" fill="#E7ECE8" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold">05 / Trust, performance and health</text><text x="258" y="722" fill="#B5C3B9" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Score or unknown / samples</text><text x="258" y="752" fill="#B5C3B9" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Rubric / freshness / appeal</text><text x="258" y="807" fill="#C9F58C" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Inspect details  &gt;</text><rect x="650" y="650" width="390" height="205" rx="8" fill="#121916" stroke="#708879" /><text x="668" y="685" fill="#E7ECE8" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold">06 / Resource limits</text><text x